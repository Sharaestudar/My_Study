<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Study - Cadastro</title>
    <link rel="stylesheet" href="frontend/style.css">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card">
            <h2>Seja bem-vindo, preencha os dados para cadastro</h2>
            
            <form action="index.html" method="GET">
                <div>
                    <label for="nome">Nome completo:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                </div>

                <div>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                </div>

                <div>
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" minlength="8" placeholder="Sua senha (mínimo 8 caracteres)" required>
                </div>

                <div>
                    <label for="confirmar-senha">Confirmar senha:</label>
                    <input type="password" id="confirmar-senha" name="confirmar_senha" minlength="8" placeholder="Repita a senha" required>
                </div>

                <button type="submit" class="btn-primary">Finalizar</button>
            </form>

            <div class="auth-links">
                <p>Já possui uma conta? <a href="index.html" class="link-inline">Fazer login</a></p>
            </div>
        </section>
    </main>

</body>
</html>
