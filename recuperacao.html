<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Study - Recuperação de Senha</title>
    <link rel="stylesheet" href="frontend/style.css">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card">
            <h2>Informe seu e-mail</h2>
            <p>Para redefinir sua senha, digite o e-mail cadastrado na sua conta.</p>

            <form action="index.html" method="GET">
                <div>
                    <label for="email">E-mail cadastrado:</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                </div>

                <button type="submit" class="btn-primary">Enviar instruções</button>
            </form>

            <div class="auth-links">
                <a href="index.html" class="link-inline">Voltar para a tela de login</a>
            </div>
        </section>
    </main>

</body>
</html>
