<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Study - Login</title>
    <link rel="stylesheet" href="frontend/style.css">
</head>
<body>

    <main>
        <section>
            <!-- Logo e Boas-Vindas -->
            <div>
                <img src="assets/logo.png" alt="Logo My Study" width="100">
                <p>Seja bem-vindo, faça seu login</p>
            </div>

            <!-- Formulário de Login -->
            <form action="dashboard.html" method="POST">
                <div>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="Seu e-mail cadastrado" required>
                </div>

                <div>
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" placeholder="Sua senha" required>
                </div>

                <button type="submit">Entrar</button>
            </form>

            <!-- Primeiro acesso (cadastro) / Recuperação de senha -->
            <div>
                <p>
                    <span>Primeira vez?</span>
                    <a href="cadastro.html"><button type="button">Cadastre-se</button></a>
                </p>
                <p>
                    <span>Esqueceu a senha?</span>
                    <a href="recuperacao.html"><button type="button">Recuperação de senha</button></a>
                </p>
            </div>
        </section>
    </main>

    <footer>
        <p>StudyFlow &copy; 2026</p>
    </footer>

</body>
</html>
