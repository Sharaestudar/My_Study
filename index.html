<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Study - Login</title>
    <link rel="stylesheet" href="frontend/style.css">
</head>
<body>

<main class="auth-container">
    <section class="auth-card">
        <h2>Seja bem-vindo, faça seu login</h2>
        <form action="dashboard.html" method="GET">
            <div>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="Seu e-mail cadastrado" required>
            </div>
            <div>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="Sua senha" required>
            </div>
            <button type="submit" class="btn-primary">Entrar</button>
        </form>

        <div class="auth-links">
            <p>Primeira vez? <a href="cadastro.html" class="link-inline">Cadastre-se</a></p>
            <p>Esqueceu a senha? <a href="recuperacao.html" class="link-inline">Recuperar senha</a></p>
        </div>
    </section>
</main>

    <footer>
        <p>StudyFlow &copy; 2026</p>
    </footer>

</body>
</html>
