<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Study - Grade de Estudos</title>
    <link rel="stylesheet" href="frontend/style.css">
</head>
<body class="app-layout">

    <!-- Menu Lateral -->
    <aside class="sidebar">
        <h1>My Study</h1>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="grade.html" class="active">Grade</a>
            <a href="cronograma.html">Cronograma</a>
            <a href="#">Configuração</a>
            <a href="index.html">Sair</a>
        </nav>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="dashboard-content">
        <header style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
            <div>
                <h2>Grade de Estudos</h2>
                <p>Organize suas matérias e tópicos.</p>
            </div>
            <!-- Botão que direciona para a tela de formulário -->
            <a href="cadastrar-materia.html" class="btn-primary" style="width: auto; padding: 0.6rem 1.2rem; text-decoration: none;">+ Nova matéria</a>
        </header>

        <!-- Campo de Pesquisa / Filtro -->
        <section class="card-panel" style="margin-bottom: 1.5rem;">
            <label for="campo-busca"><strong>Buscar matéria:</strong></label>
            <input type="text" id="campo-busca" placeholder="Digite para filtrar as matérias..." style="width: 100%; margin-top: 0.5rem; padding: 0.6rem; border-radius: 6px; border: 1px solid #334155; background-color: #0f172a; color: #fff;">
        </section>

        <!-- Container onde o JavaScript renderizará as matérias dinamicamente -->
        <section id="lista-materias">
            <div class="card-panel">
                <h3>Minhas Matérias</h3>
                <p>Nenhuma matéria cadastrada no momento. Preencha o formulário para adicionar disciplinas.</p>
            </div>
        </section>
    </main>

    <script src="frontend/script.js"></script>
    
</body>
</html>
